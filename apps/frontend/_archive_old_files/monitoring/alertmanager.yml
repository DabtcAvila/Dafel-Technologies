global:
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 5m

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_interval: 10m
      repeat_interval: 1h

    - match:
        alertname: ApplicationDown
      receiver: 'application-down'
      group_wait: 0s
      repeat_interval: 1m

    - match:
        alertname: DatabaseDown
      receiver: 'database-alerts'
      group_wait: 0s
      repeat_interval: 2m

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: '${DEFAULT_EMAIL_TO}'
        subject: '[Dafel] Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        html: |
          <h2>🚨 Dafel Frontend Alert</h2>
          <table border="1" style="border-collapse: collapse;">
            <tr>
              <th>Alert</th>
              <th>Description</th>
              <th>Severity</th>
              <th>Instance</th>
              <th>Time</th>
            </tr>
            {{ range .Alerts }}
            <tr>
              <td>{{ .Annotations.summary }}</td>
              <td>{{ .Annotations.description }}</td>
              <td style="color: {{ if eq .Labels.severity "critical" }}red{{ else if eq .Labels.severity "warning" }}orange{{ else }}green{{ end }}">
                {{ .Labels.severity }}
              </td>
              <td>{{ .Labels.instance }}</td>
              <td>{{ .StartsAt.Format "2006-01-02 15:04:05" }}</td>
            </tr>
            {{ end }}
          </table>

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        title: 'Dafel Frontend Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: '${CRITICAL_EMAIL_TO}'
        subject: '🚨 [CRITICAL] Dafel Frontend: {{ .GroupLabels.alertname }}'
        body: |
          CRITICAL ALERT TRIGGERED!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          
          Please investigate immediately!

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        title: '🚨 CRITICAL: Dafel Frontend Alert'
        text: |
          <!channel> CRITICAL ALERT!
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        color: 'danger'

    webhook_configs:
      - url: '${PAGERDUTY_WEBHOOK_URL}'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: '${WARNING_EMAIL_TO}'
        subject: '⚠️ [WARNING] Dafel Frontend: {{ .GroupLabels.alertname }}'
        body: |
          Warning Alert Triggered
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#warnings'
        title: '⚠️ WARNING: Dafel Frontend Alert'
        color: 'warning'

  - name: 'application-down'
    email_configs:
      - to: '${CRITICAL_EMAIL_TO}'
        subject: '🔥 [EMERGENCY] Dafel Frontend Application Down!'
        body: |
          EMERGENCY: APPLICATION IS DOWN!
          
          The Dafel Frontend application is not responding.
          This requires immediate attention.
          
          {{ range .Alerts }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
          
          Action Required:
          1. Check application logs
          2. Verify server status
          3. Check database connectivity
          4. Review recent deployments

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        title: '🔥 EMERGENCY: Application Down'
        text: |
          <!channel> EMERGENCY: Dafel Frontend is DOWN!
          Immediate investigation required.
        color: 'danger'

    webhook_configs:
      - url: '${PAGERDUTY_WEBHOOK_URL}'
        title: 'EMERGENCY: Application Down'
        send_resolved: true

  - name: 'database-alerts'
    email_configs:
      - to: '${DATABASE_EMAIL_TO}'
        subject: '🗄️ [DATABASE] Dafel Frontend Database Alert'
        body: |
          Database Alert Triggered
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Database: {{ .Labels.database }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
          
          Troubleshooting Steps:
          1. Check database connectivity
          2. Review database logs
          3. Check disk space
          4. Verify backup status

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#database-alerts'
        title: '🗄️ Database Alert'
        color: 'warning'

# Templates for reusable message formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'