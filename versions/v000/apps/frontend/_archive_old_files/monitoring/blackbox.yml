modules:
  http_2xx:
    prober: http
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        Host: dafel.com
        Accept-Language: en-US
      no_follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false

  http_post_2xx:
    prober: http
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"health": "check"}'
      valid_status_codes: [200, 201]

  http_basic_auth_example:
    prober: http
    http:
      method: POST
      headers:
        Host: "login.example.com"
      basic_auth:
        username: "username"
        password: "mysecret"

  http_custom_ca_example:
    prober: http
    http:
      method: GET
      tls_config:
        ca_file: "/certs/my_cert.crt"

  http_gzip:
    prober: http
    http:
      method: GET
      headers:
        Accept-Encoding: gzip
      compression: gzip

  http_json_body_example:
    prober: http
    http:
      method: POST
      body: |
        {
          "service": "health-check",
          "timestamp": "{{ .Now.Unix }}"
        }
      headers:
        Content-Type: "application/json"

  tls_connect:
    prober: tcp
    tcp:
      query_response:
      - expect: "^\\+OK"
      tls: true
      tls_config:
        insecure_skip_verify: false

  tcp_connect_example:
    prober: tcp
    tcp:
      query_response:
      - send: "QUIT"
      - expect: "^\\+OK"

  pop3s_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^\\+OK"
      tls: true
      tls_config:
        insecure_skip_verify: false

  grpc:
    prober: grpc
    grpc:
      service: "service"
      tls: true
      tls_config:
        insecure_skip_verify: false

  grpc_plain:
    prober: grpc
    grpc:
      service: "service"
      tls: false

  ssh_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^SSH-2.0-"
      - send: "SSH-2.0-blackbox-ssh-check"

  irc_banner:
    prober: tcp
    tcp:
      query_response:
      - send: "NICK prober"
      - send: "USER prober prober prober :prober"
      - expect: "PING :([^ ]+)(.*)"
      - send: "PONG ${1}"
      - expect: "^:[^ ]+ 001"

  icmp:
    prober: icmp

  icmp_ttl5:
    prober: icmp
    timeout: 5s
    icmp:
      ttl: 5

  dns_google:
    prober: dns
    dns:
      query_name: "google.com"
      query_type: "A"
      valid_rcodes:
      - NOERROR
      validate_answer_rrs:
        fail_if_matches_regexp:
        - ".*127.0.0.1"
        fail_if_all_match_regexp:
        - ".*127.0.0.1"
        fail_if_not_matches_regexp:
        - "www.google.com.\t300\tIN\tA\t216.58.209.36"
        fail_if_none_matches_regexp:
        - "216.58.209.36"

  dns_google_https:
    prober: dns
    dns:
      transport_protocol: "tcp"
      preferred_ip_protocol: "ip6"
      query_name: "google.com"
      query_type: "A"