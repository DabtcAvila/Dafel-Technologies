name: Performance Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ===============================
  # LIGHTHOUSE PERFORMANCE AUDIT
  # ===============================
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url: 
          - 'https://dafel-frontend-staging.herokuapp.com'
          - 'https://dafel-frontend-staging.herokuapp.com/studio'
          - 'https://dafel-frontend-staging.herokuapp.com/login'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          npx lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_SERVER_BASE_URL: ${{ vars.LHCI_SERVER_BASE_URL }}
          LHCI_BUILD_CONTEXT__GITHUB_REPO_SLUG: ${{ github.repository }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
          LHCI_BUILD_CONTEXT__COMMIT_SHA: ${{ github.sha }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.url }}
          path: .lighthouseci/

  # ===============================
  # WEB VITALS MONITORING
  # ===============================
  web-vitals:
    name: Web Vitals Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Web Vitals test
        run: |
          node scripts/web-vitals-test.js
        env:
          TARGET_URL: ${{ vars.TARGET_URL || 'https://dafel-frontend-staging.herokuapp.com' }}

  # ===============================
  # LOAD TESTING
  # ===============================
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load test
        run: |
          k6 run --out json=load-test-results.json scripts/load-test.js
        env:
          TARGET_URL: ${{ vars.TARGET_URL || 'https://dafel-frontend-staging.herokuapp.com' }}

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json

  # ===============================
  # BUNDLE SIZE ANALYSIS
  # ===============================
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze bundle
        run: |
          npm run analyze
          npm run build

      - name: Bundle size analysis
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read bundle stats
            const statsPath = path.join(process.cwd(), '.next/analyze/bundle-sizes.json');
            if (fs.existsSync(statsPath)) {
              const stats = JSON.parse(fs.readFileSync(statsPath, 'utf8'));
              console.log('Bundle Analysis Results:', stats);
            }

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/

  # ===============================
  # PERFORMANCE REGRESSION DETECTION
  # ===============================
  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, web-vitals, load-test, bundle-analysis]
    steps:
      - name: Download all performance artifacts
        uses: actions/download-artifact@v4

      - name: Analyze performance trends
        run: |
          echo "Analyzing performance trends..."
          # Custom script to compare with baseline metrics
          node -e "
            const fs = require('fs');
            const results = {
              lighthouse: 'lighthouse-reports-*/',
              webVitals: 'web-vitals-results.json',
              loadTest: 'load-test-results.json',
              bundleSize: 'bundle-analysis/'
            };
            
            // Performance regression logic here
            console.log('Performance analysis completed');
          "

      - name: Create performance report
        run: |
          echo "# Performance Report" > performance-report.md
          echo "## Summary" >> performance-report.md
          echo "- Lighthouse Audit: ✅" >> performance-report.md
          echo "- Web Vitals: ✅" >> performance-report.md
          echo "- Load Testing: ✅" >> performance-report.md
          echo "- Bundle Analysis: ✅" >> performance-report.md

      - name: Comment on PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md