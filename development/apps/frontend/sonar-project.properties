# SonarQube Configuration
sonar.projectKey=dafel-frontend
sonar.organization=dafel-technologies
sonar.projectName=Dafel Frontend
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Test configuration
sonar.tests=__tests__,cypress
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx,**/*.spec.js,**/*.spec.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language-specific settings
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/public/**,**/coverage/**,**/*.config.js,**/*.config.ts

# Code analysis rules
sonar.javascript.globals=window,document,console,process,Buffer,global,__dirname,__filename,module,require,exports

# Quality gate
sonar.qualitygate.wait=true

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Duplication settings
sonar.cpd.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts