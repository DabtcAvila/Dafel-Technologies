<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"
     class="dafel-banda-animatable" data-version="1.0">
  <!--
    DAFEL BANDA BAJA - Versión Animable
    Optimizado para animaciones con CSS, GSAP o Framer Motion
    Cada elemento tiene IDs únicos, clases semánticas y data-attributes
  -->

  <defs>
    <!-- GRADIENTES con IDs semánticos -->
    <radialGradient id="grad-blue-light-radial" cx="30%" cy="40%">
      <stop offset="0%" stop-color="#D0E8F5" class="color-stop-start"/>
      <stop offset="50%" stop-color="#A8D1E6" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#7DBBDB" class="color-stop-end"/>
    </radialGradient>

    <linearGradient id="grad-blue-light-linear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0DFF0" class="color-stop-start"/>
      <stop offset="100%" stop-color="#6FB3D9" class="color-stop-end"/>
    </linearGradient>

    <radialGradient id="grad-green-lime" cx="35%" cy="45%">
      <stop offset="0%" stop-color="#D5EDB8" class="color-stop-start"/>
      <stop offset="50%" stop-color="#AAD989" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#7BC77F" class="color-stop-end"/>
    </radialGradient>

    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FD4C4" class="color-stop-start"/>
      <stop offset="50%" stop-color="#3AAFA3" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#1B8F9A" class="color-stop-end"/>
    </linearGradient>

    <linearGradient id="grad-blue-medium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AAED0" class="color-stop-start"/>
      <stop offset="50%" stop-color="#3493B8" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#1E7FA4" class="color-stop-end"/>
    </linearGradient>

    <linearGradient id="grad-blue-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B88AA" class="color-stop-start"/>
      <stop offset="50%" stop-color="#1A6983" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#0E5F7E" class="color-stop-end"/>
    </linearGradient>

    <linearGradient id="grad-blue-deepest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7696" class="color-stop-start"/>
      <stop offset="50%" stop-color="#115A75" class="color-stop-mid"/>
      <stop offset="100%" stop-color="#094A62" class="color-stop-end"/>
    </linearGradient>

    <!-- PATRONES DE CUADRÍCULA -->
    <pattern id="pattern-grid-teal" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0v18M0 0h18" stroke="#fff" stroke-width="1.5" opacity=".25" class="grid-lines"/>
    </pattern>

    <pattern id="pattern-grid-blue-medium" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0v16M0 0h16" stroke="#fff" stroke-width="1.8" opacity=".3" class="grid-lines"/>
    </pattern>

    <pattern id="pattern-grid-blue-dark" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 0v14M0 0h14" stroke="#fff" stroke-width="2" opacity=".32" class="grid-lines"/>
    </pattern>

    <!-- FILTROS -->
    <filter id="filter-shadow-subtle">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- FONDO -->
  <rect id="background-canvas" class="layer-background" width="1280" height="720" fill="#F8FBFD"
        data-layer="background" data-animate="false"/>

  <!-- CAPA 1: Banda azul clara de fondo -->
  <g id="layer-1-blue-light-back"
     class="layer-background band-curved"
     opacity="0.45"
     data-layer="1"
     data-color="blue-light"
     data-animate="true"
     data-duration="4s"
     data-delay="0s">
    <path id="path-layer-1"
          class="band-path"
          fill="url(#grad-blue-light-radial)"
          d="M60 280Q200 240 340 220T600 240T860 300T1120 380Q1160 400 1200 420V600Q1160 580 1120 560T860 480T600 420T340 400Q200 420 60 460Z"/>
  </g>

  <!-- CAPA 2: Segunda banda azul clara -->
  <g id="layer-2-blue-light-top"
     class="layer-background band-curved"
     opacity="0.55"
     data-layer="2"
     data-color="blue-light"
     data-animate="true"
     data-duration="3.8s"
     data-delay="0.15s">
    <path id="path-layer-2"
          class="band-path"
          fill="url(#grad-blue-light-linear)"
          d="M80 240Q220 210 360 200T620 220T880 280Q950 305 1020 330V450Q950 425 880 400T620 340T360 320Q220 330 80 360Z"/>
  </g>

  <!-- CAPA 3: Banda verde lima -->
  <g id="layer-3-green-lime"
     class="layer-middle band-curved"
     opacity="0.38"
     data-layer="3"
     data-color="green-lime"
     data-animate="true"
     data-duration="4.2s"
     data-delay="0.3s">
    <path id="path-layer-3"
          class="band-path"
          fill="url(#grad-green-lime)"
          d="M140 260Q280 240 420 230T680 260T940 330Q980 355 1020 380V520Q980 495 940 470T680 400T420 370Q280 380 140 400Z"/>
  </g>

  <!-- CAPA 4: Banda teal con cuadrícula -->
  <g id="layer-4-teal-grid"
     class="layer-middle band-curved band-with-grid"
     opacity="0.65"
     data-layer="4"
     data-color="teal"
     data-animate="true"
     data-duration="3.5s"
     data-delay="0.45s"
     data-has-grid="true">
    <!-- Base gradient -->
    <path id="path-layer-4-base"
          class="band-path band-base"
          fill="url(#grad-teal)"
          d="M180 320Q320 300 460 290T720 320T980 390Q1050 425 1120 460V560Q1050 525 980 490T720 420T460 390Q320 400 180 420Z"/>
    <!-- Grid overlay -->
    <path id="path-layer-4-grid"
          class="band-path band-grid-overlay"
          fill="url(#pattern-grid-teal)"
          d="M180 320Q320 300 460 290T720 320T980 390Q1050 425 1120 460V560Q1050 525 980 490T720 420T460 390Q320 400 180 420Z"/>
  </g>

  <!-- CAPA 5: Banda azul medio con cuadrícula -->
  <g id="layer-5-blue-medium-grid"
     class="layer-middle band-curved band-with-grid"
     opacity="0.7"
     data-layer="5"
     data-color="blue-medium"
     data-animate="true"
     data-duration="3.3s"
     data-delay="0.6s"
     data-has-grid="true">
    <!-- Base gradient -->
    <path id="path-layer-5-base"
          class="band-path band-base"
          fill="url(#grad-blue-medium)"
          d="M220 380Q360 360 500 350T760 380T1020 450Q1090 485 1160 520V605Q1090 570 1020 535T760 465T500 435Q360 445 220 465Z"/>
    <!-- Grid overlay -->
    <path id="path-layer-5-grid"
          class="band-path band-grid-overlay"
          fill="url(#pattern-grid-blue-medium)"
          d="M220 380Q360 360 500 350T760 380T1020 450Q1090 485 1160 520V605Q1090 570 1020 535T760 465T500 435Q360 445 220 465Z"/>
  </g>

  <!-- CAPA 6: Banda azul oscuro con cuadrícula -->
  <g id="layer-6-blue-dark-grid"
     class="layer-front band-curved band-with-grid band-with-shadow"
     opacity="0.75"
     filter="url(#filter-shadow-subtle)"
     data-layer="6"
     data-color="blue-dark"
     data-animate="true"
     data-duration="3s"
     data-delay="0.75s"
     data-has-grid="true"
     data-has-shadow="true">
    <!-- Base gradient -->
    <path id="path-layer-6-base"
          class="band-path band-base"
          fill="url(#grad-blue-dark)"
          d="M260 440Q400 420 540 410T800 440T1060 510Q1130 545 1200 580V655Q1130 620 1060 585T800 515T540 485Q400 495 260 515Z"/>
    <!-- Grid overlay -->
    <path id="path-layer-6-grid"
          class="band-path band-grid-overlay"
          fill="url(#pattern-grid-blue-dark)"
          d="M260 440Q400 420 540 410T800 440T1060 510Q1130 545 1200 580V655Q1130 620 1060 585T800 515T540 485Q400 495 260 515Z"/>
  </g>

  <!-- CAPA 7: Banda azul profundo frontal -->
  <g id="layer-7-blue-deepest-front"
     class="layer-front band-curved band-with-shadow"
     opacity="0.82"
     filter="url(#filter-shadow-subtle)"
     data-layer="7"
     data-color="blue-deepest"
     data-animate="true"
     data-duration="2.8s"
     data-delay="0.9s"
     data-has-shadow="true">
    <path id="path-layer-7"
          class="band-path"
          fill="url(#grad-blue-deepest)"
          d="M300 500Q440 480 580 470T840 500T1100 570Q1170 605 1240 640V705Q1170 670 1100 635T840 565T580 535Q440 545 300 565Z"/>
  </g>
</svg>
