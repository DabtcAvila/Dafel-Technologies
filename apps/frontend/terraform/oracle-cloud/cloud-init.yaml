#cloud-config
# Cloud-init configuration for Dafel Technologies on Oracle Cloud ARM Ampere
# Automatically sets up Docker, dependencies, and deploys the application

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - htop
  - neofetch
  - ufw
  - fail2ban
  - certbot
  - python3-certbot-nginx

# Docker installation for ARM64
runcmd:
  # System setup
  - echo "🚀 Starting Dafel Technologies setup on ARM Ampere..."
  - neofetch
  
  # Configure timezone
  - timedatectl set-timezone America/Mexico_City
  
  # Install Docker (ARM64 compatible)
  - curl -fsSL https://get.docker.com -o get-docker.sh
  - sh get-docker.sh
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker
  
  # Install Docker Compose v2
  - mkdir -p /usr/local/lib/docker/cli-plugins
  - curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  - ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
  
  # Firewall configuration
  - ufw --force enable
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3000/tcp
  - ufw allow 3001/tcp
  - ufw allow 9090/tcp
  
  # Fail2ban configuration
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Create application directory
  - mkdir -p /opt/dafel
  - chown ubuntu:ubuntu /opt/dafel
  - cd /opt/dafel
  
  # Clone repository
  - sudo -u ubuntu git clone https://github.com/davicho-codigo/Dafel-Technologies.git .
  
  # Setup environment files
  - echo "${env_config}" | base64 -d > /opt/dafel/.env.production
  - echo "${docker_compose_config}" | base64 -d > /opt/dafel/docker-compose.production.yml
  - chown ubuntu:ubuntu /opt/dafel/.env.production
  - chown ubuntu:ubuntu /opt/dafel/docker-compose.production.yml
  
  # Mount additional storage
  - mkdir -p /opt/dafel/data
  - echo "Waiting for block volume..."
  - sleep 30
  
  # Install Node.js (ARM64 compatible)
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  
  # Setup swap (important for ARM systems)
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' | tee -a /etc/fstab
  
  # System optimizations for production
  - echo 'vm.swappiness=10' >> /etc/sysctl.conf
  - echo 'net.core.rmem_max=16777216' >> /etc/sysctl.conf
  - echo 'net.core.wmem_max=16777216' >> /etc/sysctl.conf
  - echo 'net.ipv4.tcp_rmem=4096 65536 16777216' >> /etc/sysctl.conf
  - echo 'net.ipv4.tcp_wmem=4096 65536 16777216' >> /etc/sysctl.conf
  - sysctl -p
  
  # Create deployment script
  - |
    cat > /opt/dafel/deploy.sh << 'EOF'
    #!/bin/bash
    cd /opt/dafel
    echo "🚀 Deploying Dafel Technologies..."
    
    # Pull latest changes
    git pull origin main
    
    # Build and deploy with docker compose
    docker compose -f docker-compose.production.yml down
    docker compose -f docker-compose.production.yml build --no-cache
    docker compose -f docker-compose.production.yml up -d
    
    # Health check
    echo "Waiting for services to start..."
    sleep 60
    
    if curl -f http://localhost:3000/health; then
      echo "✅ Dafel Technologies deployed successfully!"
      echo "🌐 Access your application at: http://$(curl -s ifconfig.me)"
    else
      echo "❌ Deployment failed - checking logs..."
      docker compose -f docker-compose.production.yml logs
    fi
    EOF
  
  - chmod +x /opt/dafel/deploy.sh
  - chown ubuntu:ubuntu /opt/dafel/deploy.sh
  
  # Create SSL setup script
  - |
    cat > /opt/dafel/setup-ssl.sh << 'EOF'
    #!/bin/bash
    echo "🔒 Setting up SSL for dafel.com.mx..."
    
    # Get Let's Encrypt certificate
    certbot certonly --standalone -d dafel.com.mx -d www.dafel.com.mx --non-interactive --agree-tos --email admin@dafel.com.mx
    
    # Copy certificates to nginx directory
    mkdir -p /opt/dafel/nginx/ssl
    cp /etc/letsencrypt/live/dafel.com.mx/fullchain.pem /opt/dafel/nginx/ssl/dafel.com.mx.crt
    cp /etc/letsencrypt/live/dafel.com.mx/privkey.pem /opt/dafel/nginx/ssl/dafel.com.mx.key
    
    # Setup auto-renewal
    echo "0 12 * * * /usr/bin/certbot renew --quiet" | crontab -
    
    echo "✅ SSL certificates configured!"
    EOF
  
  - chmod +x /opt/dafel/setup-ssl.sh
  - chown ubuntu:ubuntu /opt/dafel/setup-ssl.sh
  
  # Create monitoring script
  - |
    cat > /opt/dafel/monitor.sh << 'EOF'
    #!/bin/bash
    echo "📊 Dafel Technologies System Status"
    echo "=================================="
    echo "🖥️  CPU Usage: $(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1"%"}')"
    echo "💾  Memory: $(free -h | awk '/^Mem:/ {print $3 "/" $2}')"
    echo "💿  Disk: $(df -h / | awk '/\// {print $3 "/" $2 " (" $5 ")"}')"
    echo "🌐  Public IP: $(curl -s ifconfig.me)"
    echo "⚡  Uptime: $(uptime -p)"
    echo ""
    echo "🐳 Docker Status:"
    docker compose -f /opt/dafel/docker-compose.production.yml ps
    EOF
  
  - chmod +x /opt/dafel/monitor.sh
  - chown ubuntu:ubuntu /opt/dafel/monitor.sh
  
  # Initial deployment
  - cd /opt/dafel
  - sudo -u ubuntu ./deploy.sh
  
  # Setup completed notification
  - echo "✅ Dafel Technologies setup completed on Oracle Cloud ARM Ampere!"
  - echo "📊 System specs: 4 vCPU ARM, 24GB RAM, 200GB storage"
  - echo "🌐 Application will be available at: http://$(curl -s ifconfig.me):3000"
  - echo "📈 Monitoring: http://$(curl -s ifconfig.me):3001 (Grafana)"
  
write_files:
  - path: /etc/motd
    content: |
      
      ╔══════════════════════════════════════════╗
      ║        🚀 DAFEL TECHNOLOGIES 🚀          ║
      ║     Oracle Cloud ARM Ampere Server       ║
      ║                                          ║
      ║  💻 4 vCPU ARM + 24GB RAM + 200GB SSD   ║
      ║  🌐 Application: http://IP:3000          ║
      ║  📊 Monitoring: http://IP:3001           ║
      ║  🔧 Deploy: /opt/dafel/deploy.sh         ║
      ║  📈 Monitor: /opt/dafel/monitor.sh       ║
      ╚══════════════════════════════════════════╝
      
  - path: /etc/systemd/system/dafel.service
    content: |
      [Unit]
      Description=Dafel Technologies Application
      After=docker.service
      Requires=docker.service
      
      [Service]
      Type=forking
      User=ubuntu
      WorkingDirectory=/opt/dafel
      ExecStart=/opt/dafel/deploy.sh
      ExecStop=/usr/local/bin/docker-compose -f docker-compose.production.yml down
      Restart=always
      RestartSec=10
      
      [Install]
      WantedBy=multi-user.target

final_message: |
  🎉 Dafel Technologies is ready on Oracle Cloud ARM Ampere!
  
  Specifications:
  - 4 vCPU ARM Ampere processors
  - 24GB RAM
  - 200GB SSD storage
  - Ubuntu 22.04 LTS
  - Docker + Docker Compose
  - Nginx + SSL ready
  - Monitoring (Prometheus + Grafana)
  
  Next steps:
  1. Point dafel.com.mx DNS to this server
  2. Run: sudo /opt/dafel/setup-ssl.sh
  3. Access: https://dafel.com.mx
  
  Your enterprise-grade infrastructure is ready! 🚀