version: '3.8'

services:
  # Frontend Next.js Application (ARM64 optimized)
  dafel-frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      platforms:
        - linux/arm64
    container_name: dafel-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://dafel.com.mx
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    networks:
      - dafel-network
    volumes:
      - ./logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dafel.rule=Host(\`dafel.com.mx\`,\`www.dafel.com.mx\`)"
      - "traefik.http.routers.dafel.tls=true"
      - "traefik.http.routers.dafel.tls.certresolver=letsencrypt"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dafel-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: dafel_production
      POSTGRES_USER: dafel_prod_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - dafel-network
    ports:
      - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dafel-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dafel-network
    ports:
      - "6379:6379"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dafel-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - dafel-frontend
    networks:
      - dafel-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: dafel-prometheus-prod
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - dafel-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: dafel-grafana-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - dafel-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  dafel-network:
    driver: bridge